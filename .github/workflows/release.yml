name: Release APK

on:
  push:
    branches: [main]
    # A push touching only these paths builds an identical APK, so skip the
    # ~11 minute build and the 600 MB of uploads.
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APKs
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - run: ./gradlew assembleRelease -Penable-updater

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --json tagName --jq '.[].tagName'); do
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Create release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(git rev-list --count HEAD)
          gh release create "r$COUNT" \
            --title "Goonyomi r$COUNT (${{ github.sha }})" \
            --notes "Auto-built from ${{ github.sha }}" \
            app/build/outputs/apk/release/*.apk