name: Release APK

on:
  push:
    branches: [main]
    # A push touching only these paths builds an identical APK, so skip the
    # ~11 minute build and the 600 MB of uploads.
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APKs
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      # Cheapest and most likely to fail first, so a bad push dies in seconds
      # instead of after a multi-minute build.
      # spotless: .editorconfig was missing for this repo's whole life, so
      # nothing was enforcing the format and 47 files drifted.
      - run: ./gradlew spotlessCheck
      # assembleRelease never compiles the test source set, so a refactor can
      # leave broken tests behind and still look green.
      - run: ./gradlew :domain:test
      - run: ./gradlew assembleRelease -Penable-updater

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the two newest so a bad release has something to fall back to.
          for tag in $(gh release list --json tagName --jq '.[].tagName' | tail -n +3); do
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Create release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(git rev-list --count HEAD)
          gh release create "r$COUNT" \
            --title "Goonyomi r$COUNT (${{ github.sha }})" \
            --notes "Auto-built from ${{ github.sha }}" \
            app/build/outputs/apk/release/*.apk